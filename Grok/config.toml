# Fragment for ~/.grok/config.toml — merge these tables into your existing config.
# Grok keys static remote headers under `[mcp_servers.<name>.headers]`; stdio server
# env vars under `[mcp_servers.<name>.env]`.

[mcp_servers.nixos]
command = "nix"
args = ["run", "github:utensils/mcp-nixos", "--"]
enabled = true

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true

[mcp_servers.context7.headers]
Authorization = "Bearer YOUR_CONTEXT7_API_KEY"

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"
enabled = true

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/spacecraft-software"]
enabled = true

[mcp_servers.fetch]
command = "uvx"
args = ["--with", "mcp<2", "mcp-server-fetch"]
enabled = true

[mcp_servers.engram]
command = "engram"
args = ["--db", "/home/mj/.gemini/engram.db", "mcp"]
enabled = true

[mcp_servers.brave-search]
command = "npx"
args = ["-y", "@brave/brave-search-mcp-server"]
enabled = true

[mcp_servers.brave-search.env]
BRAVE_API_KEY = "YOUR_BRAVE_API_KEY"

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]
enabled = true

[mcp_servers.perplexity]
command = "npx"
args = ["-y", "perplexity-mcp"]
enabled = true

[mcp_servers.perplexity.env]
PERPLEXITY_API_KEY = "YOUR_PERPLEXITY_API_KEY"

[mcp_servers.terminal]
command = "npx"
args = ["-y", "mcp-server-terminal"]
enabled = true

[mcp_servers.terminal.env]
RUST_LOG = "error"
NO_COLOR = "1"
TERM = "dumb"

[mcp_servers.crates]
command = "crates-mcp"
enabled = true

[mcp_servers.crates.env]
RUST_LOG = "error"
NO_COLOR = "1"
TERM = "dumb"

[mcp_servers.bravais-cli]
command = "bravais-cli"
args = ["mcp"]
enabled = true

