#
# The single source of truth for every MCP server this repository configures.
#
#   mcpctl render   regenerates all 13 host templates from this file
#   mcpctl check    verifies the templates agree with each other
#   mcpctl deploy   pushes the templates into the live configs under $HOME
#
# This file owns *content*: which servers exist, how they are invoked, where each
# host's live config lives. It does NOT own dialect mechanics (which key holds a URL,
# whether env vars go under `env` or `environment`) — those are facts about each host's
# schema and live in the HOSTS table in `mcpctl/src/dialect.rs`.
#
# Editing rules:
#   * Change a server here, never in a template — `render` overwrites templates.
#   * `[servers.overrides.<Host>]` records a difference that is CORRECT for that host.
#     Anything not listed there is drift and `check` will fail on it.
#   * Never put a real API key here. Secrets are placeholders, filled into the live
#     configs by `mcpctl fill-keys`.

# ---------------------------------------------------------------------------
# Secrets — placeholder tokens substituted into the live configs at fill time.
# Order determines the order of VS Code's generated `inputs` array.
# ---------------------------------------------------------------------------

[[secrets]]
env = "CONTEXT7_API_KEY"
placeholder = "YOUR_CONTEXT7_API_KEY"
description = "Context7 API key"

[[secrets]]
env = "BRAVE_API_KEY"
placeholder = "YOUR_BRAVE_API_KEY"
description = "Brave Search API key"

[[secrets]]
env = "PERPLEXITY_API_KEY"
placeholder = "YOUR_PERPLEXITY_API_KEY"
description = "Perplexity API key"

[[secrets]]
env = "GITHUB_PERSONAL_ACCESS_TOKEN"
placeholder = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"
description = "GitHub personal access token"

# ---------------------------------------------------------------------------
# Servers — declared in every host, in this order.
# ---------------------------------------------------------------------------

[[servers]]
name = "nixos"
transport = "stdio"
command = "nix"
args = ["run", "github:utensils/mcp-nixos", "--"]
# There is no `mcp-nixos` binary on this machine — it is only ever reached through
# `nix run`. An Antigravity override that called it directly shipped in the first
# manifest and Antigravity answered with
# `exec: "mcp-nixos": executable file not found in $PATH`. Do not reintroduce it
# without first checking `command -v mcp-nixos`.

[[servers]]
name = "context7"
transport = "http"
url = "https://mcp.context7.com/mcp"
# `Authorization: Bearer` is the form Context7 documents for every client. The older
# `CONTEXT7_API_KEY:` header does still authenticate — verified against the live endpoint,
# where a bad key under that header is rejected with "Invalid API key" rather than being
# ignored — but it is undocumented upstream and appears only in two third-party clients'
# setup pages. Since unauthenticated requests also succeed (at a lower rate limit), a
# header that silently stopped being read would look exactly like one that works, so the
# documented form is the safer thing to depend on.
headers = { Authorization = "Bearer YOUR_CONTEXT7_API_KEY" }

# VS Code resolves secrets through a prompted `input`, never a literal placeholder.
[servers.overrides.VSCode]
headers = { Authorization = "Bearer ${input:CONTEXT7_API_KEY}" }

[[servers]]
name = "microsoft-learn"
transport = "http"
url = "https://learn.microsoft.com/api/mcp"

[[servers]]
name = "filesystem"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/spacecraft-software"]

[[servers]]
name = "fetch"
transport = "stdio"
command = "uvx"
# The `mcp<2` pin is load-bearing. mcp-server-fetch 2026.7.10 declares only
# `mcp>=1.1.3` but imports `McpError`, which mcp 2.0.0 renamed to `MCPError`.
# Unpinned, the server dies at import and the host reports `calling "initialize": EOF`.
# Drop the pin only once upstream ships a release that imports `MCPError`.
args = ["--with", "mcp<2", "mcp-server-fetch"]

[[servers]]
name = "engram"
transport = "stdio"
# Bare name: resolved on PATH, where Bravais now supplies it from the Engram
# flake input rather than a `cargo install` build of a working tree.
command = "engram"
# `--db` is a GLOBAL flag, so it precedes the `mcp` subcommand.
#
# The store moved off ~/.gemini/engram.db, which was never Gemini-specific —
# just wherever the first harness happened to register it, after which every
# other harness copied the path. It is an ordinary XDG data path now.
#
# Passing --db explicitly is deliberate, not redundant with the ENGRAM_DB
# variable Bravais sets: that variable reaches processes descended from the
# login session, but a harness launched from a desktop entry, Flatpak, or GUI
# launcher may have a pruned environment. Engram's own --db default is the bare
# RELATIVE path "engram.db", so a server inheriting neither silently opens a
# brand-new empty store in whatever directory its harness started in.
args = ["--db", "/home/mj/.local/share/engram/engram.db", "mcp"]

[[servers]]
name = "brave-search"
transport = "stdio"
command = "npx"
args = ["-y", "@brave/brave-search-mcp-server"]
env = { BRAVE_API_KEY = "YOUR_BRAVE_API_KEY" }

[servers.overrides.VSCode]
env = { BRAVE_API_KEY = "${input:BRAVE_API_KEY}" }

[[servers]]
name = "sequential-thinking"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

# Declared everywhere but shipped off under Claude Code, via that host's
# `disabledMcpjsonServers` list — `.mcp.json` has no per-server disable field.
[servers.overrides.ClaudeCode]
enabled = false

[[servers]]
name = "perplexity"
transport = "stdio"
command = "npx"
args = ["-y", "perplexity-mcp"]
env = { PERPLEXITY_API_KEY = "YOUR_PERPLEXITY_API_KEY" }

[servers.overrides.VSCode]
env = { PERPLEXITY_API_KEY = "${input:PERPLEXITY_API_KEY}" }

[[servers]]
name = "terminal"
transport = "stdio"
command = "npx"
args = ["-y", "mcp-server-terminal"]
# Keeps TUI output plain so an agent reads it cleanly.
env = { RUST_LOG = "error", NO_COLOR = "1", TERM = "dumb" }

[[servers]]
name = "crates"
transport = "stdio"
command = "crates-mcp"
# Load-bearing, exactly as for `terminal`. crates-mcp writes its `tracing` output to
# **stdout**, not stderr, and colours it — so the first bytes a host reads are
# `\x1b[2m2026-…  WARN crates_mcp::crates_client: …` rather than JSON-RPC. Claude Code
# skips lines it cannot parse and works anyway; Antigravity's Go client hard-fails with
# `calling "initialize": invalid character '\x1b' looking for beginning of value`.
# RUST_LOG=error silences the WARN/INFO pair, leaving the stream clean.
env = { RUST_LOG = "error", NO_COLOR = "1", TERM = "dumb" }

[[servers]]
name = "bravais-cli"
transport = "stdio"
command = "bravais-cli"
args = ["mcp"]

[[servers]]
name = "github"
transport = "stdio"
command = "nix"
# Reached through `nix run`, like `nixos`, rather than as a bare binary: there is no
# `github-mcp-server` on PATH on this machine. `nixpkgs#` resolves through the flake
# registry, whose `nixpkgs` entry is pinned to a local store path here, so evaluation
# needs no network — but the version therefore follows the system closure rather than
# nixpkgs HEAD. Check `nix run nixpkgs#github-mcp-server -- --version` before assuming
# a tool added upstream exists here.
args = ["run", "nixpkgs#github-mcp-server", "--", "stdio"]
# GITHUB_READ_ONLY is load-bearing, not a convenience. Standard §6.4 makes outbound
# contribution default-deny and forbids automation from initiating one; this server's
# write tools (create PR, open issue, comment, push) are exactly that act, on any repo
# the token can reach. Dropping this line hands every host in this repository the
# ability to perform it silently.
#
# GITHUB_TOOLSETS trims the tool surface to the five toolsets this workspace uses; the
# default exposes every toolset to every host on every launch.
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN", GITHUB_TOOLSETS = "context,repos,issues,pull_requests,actions", GITHUB_READ_ONLY = "1" }

# VS Code resolves secrets through a prompted `input`, never a literal placeholder. The
# other two variables are repeated because an override replaces `env` wholesale — it does
# not merge — so omitting them would drop read-only mode on this host alone.
[servers.overrides.VSCode]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${input:GITHUB_PERSONAL_ACCESS_TOKEN}", GITHUB_TOOLSETS = "context,repos,issues,pull_requests,actions", GITHUB_READ_ONLY = "1" }

[[servers]]
name = "obscura"
transport = "stdio"
# Bare name, like `engram`, `crates` and `bravais-cli`: Bravais installs Obscura into
# the SYSTEM profile (modules/packages/ai.nix) rather than the user one precisely so
# this resolves for a host launched from a desktop entry with a pruned environment.
command = "obscura"
args = ["mcp"]
# Deliberately no RUST_LOG/NO_COLOR/TERM block, unlike `crates` and `terminal` — and
# that is measured, not assumed. `obscura mcp` writes nothing to stdout but JSON-RPC
# and nothing at all to stderr, even with RUST_LOG=debug set in the environment, so
# there is no log output to silence. Re-probe before adding one.
#
# A headless browser with no Chromium and no Node: it drives navigation, clicks, forms,
# tabs, cookies and extraction on a real V8 isolate. Two of its tools, browser_screenshot
# and browser_pdf, exist only because Bravais builds Obscura with the `render` feature —
# a default-feature build (which is all nixpkgs offers) drops them from tools/list
# without erroring. If they go missing, suspect the build, not this entry.

# ---------------------------------------------------------------------------
# Hosts — where each host's template and live config files are.
#
# `live` paths are what `deploy` and `fill-keys` write to. `~` expands to $HOME.
# ---------------------------------------------------------------------------

[[hosts]]
name = "Antigravity"
live = [
  "~/.gemini/config/mcp_config.json",
  "~/.gemini/antigravity/mcp_config.json",
  # Present on this machine but absent from every previous version of the
  # fill-keys path lists, so it silently kept stale keys and servers.
  "~/.gemini/antigravity-ide/mcp_config.json",
]

[[hosts]]
name = "VSCode"
live = ["~/.config/Code/User/mcp.json"]
# VS Code cannot hold a literal secret in `mcp.json`; it prompts through `inputs`.
emit_inputs = true

[[hosts]]
name = "GitHubCopilotCLI"
live = ["~/.copilot/mcp-config.json"]

[[hosts]]
name = "ClaudeCode"
live = ["~/.claude.json"]
# `.mcp.json` has no per-server disable field, so the off switch lives here.
companion_disabled_file = "ClaudeCode/settings.json"
companion_disabled_live = "~/.claude/settings.json"
# Claude Code owns ~/.claude.json and rewrites it, so a deploy applied underneath a
# running instance is silently reverted. Exit the host before deploying to it.
guard_process = "claude"

[[hosts]]
name = "OpenClaude"
live = ["~/.openclaude.json"]

[[hosts]]
name = "Codex"
live = ["~/.codex/config.toml"]
header = """
Fragment for ~/.codex/config.toml — merge these tables into your existing config.
Codex serves HTTP MCP over its streamable_http transport natively (no extra flag
needed on current builds). Static remote headers use the `http_headers` key; stdio
server env vars use the `env` key."""

[[hosts]]
name = "Grok"
live = ["~/.grok/config.toml"]
header = """
Fragment for ~/.grok/config.toml — merge these tables into your existing config.
Grok keys static remote headers under `[mcp_servers.<name>.headers]`; stdio server
env vars under `[mcp_servers.<name>.env]`."""

[[hosts]]
name = "Kimi"
live = ["~/.kimi-code/mcp.json"]

[[hosts]]
name = "Gemini"
live = ["~/.gemini/settings.json"]
header = "Merge the mcpServers block into ~/.gemini/settings.json. Gemini CLI keys HTTP servers with `url` + `type: http`. New servers must also be enabled in ~/.gemini/mcp-server-enablement.json (see mcp-server-enablement.json here), and the working folder must be trusted for user-level servers to activate."
# Gemini will not start a server that is not also listed in its enablement file.
companion_enablement_file = "Gemini/mcp-server-enablement.json"
companion_enablement_live = "~/.gemini/mcp-server-enablement.json"

[[hosts]]
name = "Qwen"
live = ["~/.qwen/settings.json"]

[[hosts]]
name = "OpenCode"
live = ["~/.config/opencode/opencode.jsonc"]
schema_url = "https://opencode.ai/config.json"

[[hosts]]
name = "Mimo"
live = ["~/.config/mimocode/mimocode.jsonc"]
# Mimo is an opencode fork and points at opencode's schema. Verified against the
# current template rather than assumed — there is no mimocode.ai schema URL.
schema_url = "https://opencode.ai/config.json"

[[hosts]]
name = "Goose"
live = ["~/.config/goose/config.yaml"]
header = """
Fragment for ~/.config/goose/config.yaml — merge the `extensions` block into your
existing config. goose calls MCP servers "extensions"; remote ones use the
`streamable_http` type with a `uri` field; stdio env vars go under `envs`."""
# goose ships ~16 builtin extensions (developer, computercontroller, ...) in the same
# `extensions` block. They are not drift and must never be offered up for pruning.
prune_strays = false
