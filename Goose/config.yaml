# Fragment for ~/.config/goose/config.yaml — merge the `extensions` block into your
# existing config. goose calls MCP servers "extensions"; remote ones use the
# `streamable_http` type with a `uri` field; stdio env vars go under `envs`.
extensions:
  nixos:
    name: nixos
    type: stdio
    cmd: nix
    args:
      - run
      - github:utensils/mcp-nixos
      - --
    enabled: true
    timeout: 300
  context7:
    name: context7
    type: streamable_http
    uri: https://mcp.context7.com/mcp
    headers:
      Authorization: Bearer YOUR_CONTEXT7_API_KEY
    enabled: true
    timeout: 300
  microsoft-learn:
    name: microsoft-learn
    type: streamable_http
    uri: https://learn.microsoft.com/api/mcp
    enabled: true
    timeout: 300
  filesystem:
    name: filesystem
    type: stdio
    cmd: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - /spacecraft-software
    enabled: true
    timeout: 300
  fetch:
    name: fetch
    type: stdio
    cmd: uvx
    args:
      - --with
      - mcp<2
      - mcp-server-fetch
    enabled: true
    timeout: 300
  engram:
    name: engram
    type: stdio
    cmd: engram
    args:
      - --db
      - /home/mj/.local/share/engram/engram.db
      - mcp
    enabled: true
    timeout: 300
  brave-search:
    name: brave-search
    type: stdio
    cmd: npx
    args:
      - -y
      - "@brave/brave-search-mcp-server"
    envs:
      BRAVE_API_KEY: YOUR_BRAVE_API_KEY
    enabled: true
    timeout: 300
  sequential-thinking:
    name: sequential-thinking
    type: stdio
    cmd: npx
    args:
      - -y
      - "@modelcontextprotocol/server-sequential-thinking"
    enabled: true
    timeout: 300
  perplexity:
    name: perplexity
    type: stdio
    cmd: npx
    args:
      - -y
      - perplexity-mcp
    envs:
      PERPLEXITY_API_KEY: YOUR_PERPLEXITY_API_KEY
    enabled: true
    timeout: 300
  terminal:
    name: terminal
    type: stdio
    cmd: npx
    args:
      - -y
      - mcp-server-terminal
    envs:
      RUST_LOG: error
      NO_COLOR: "1"
      TERM: dumb
    enabled: true
    timeout: 300
  crates:
    name: crates
    type: stdio
    cmd: crates-mcp
    envs:
      RUST_LOG: error
      NO_COLOR: "1"
      TERM: dumb
    enabled: true
    timeout: 300
  bravais-cli:
    name: bravais-cli
    type: stdio
    cmd: bravais-cli
    args:
      - mcp
    enabled: true
    timeout: 300
  github:
    name: github
    type: stdio
    cmd: nix
    args:
      - run
      - nixpkgs#github-mcp-server
      - --
      - stdio
    envs:
      GITHUB_PERSONAL_ACCESS_TOKEN: YOUR_GITHUB_PERSONAL_ACCESS_TOKEN
      GITHUB_TOOLSETS: context,repos,issues,pull_requests,actions
      GITHUB_READ_ONLY: "1"
    enabled: true
    timeout: 300
  obscura:
    name: obscura
    type: stdio
    cmd: obscura
    args:
      - mcp
    enabled: true
    timeout: 300
