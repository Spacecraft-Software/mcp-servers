# Fragment for ~/.codex/config.toml — merge these tables into your existing config.
# Codex serves HTTP MCP over its streamable_http transport natively (no extra flag
# needed on current builds). Static remote headers use the `http_headers` key; stdio
# server env vars use the `env` key.

[mcp_servers.nixos]
command = "nix"
args = ["run", "github:utensils/mcp-nixos", "--"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.context7.http_headers]
Authorization = "Bearer YOUR_CONTEXT7_API_KEY"

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/spacecraft-software"]

[mcp_servers.fetch]
command = "uvx"
args = ["--with", "mcp<2", "mcp-server-fetch"]

[mcp_servers.engram]
command = "engram"
args = ["--db", "/home/mj/.local/share/engram/engram.db", "mcp"]

[mcp_servers.brave-search]
command = "npx"
args = ["-y", "@brave/brave-search-mcp-server"]

[mcp_servers.brave-search.env]
BRAVE_API_KEY = "YOUR_BRAVE_API_KEY"

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers.perplexity]
command = "npx"
args = ["-y", "perplexity-mcp"]

[mcp_servers.perplexity.env]
PERPLEXITY_API_KEY = "YOUR_PERPLEXITY_API_KEY"

[mcp_servers.terminal]
command = "npx"
args = ["-y", "mcp-server-terminal"]

[mcp_servers.terminal.env]
RUST_LOG = "error"
NO_COLOR = "1"
TERM = "dumb"

[mcp_servers.crates]
command = "crates-mcp"

[mcp_servers.crates.env]
RUST_LOG = "error"
NO_COLOR = "1"
TERM = "dumb"

[mcp_servers.bravais-cli]
command = "bravais-cli"
args = ["mcp"]

[mcp_servers.github]
command = "nix"
args = ["run", "nixpkgs#github-mcp-server", "--", "stdio"]

[mcp_servers.github.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"
GITHUB_TOOLSETS = "context,repos,issues,pull_requests,actions"
GITHUB_READ_ONLY = "1"

